name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: l7v0l
          outputs: |
            dist/snake.svg?palette=github-dark
      - name: Commit snake
        run: |
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh snake"
          git pull --rebase
          git push
